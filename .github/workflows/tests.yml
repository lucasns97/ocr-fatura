name: Tests

# The shipper agent waits for a workflow named "Tests"; keep the name.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share a group per branch so a new push cancels the old run; every main push gets its own
  # group (run_id), so a queued run can't replace a merge commit's pending one.
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (Python from .python-version)
        run: uv sync --frozen
      - name: Run every check
        run: ./scripts/verify.sh

  windows:
    # The real user is on Windows: run the tests there, then the actual installer and launcher.
    name: Windows install + start
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: |
          uv sync --frozen
          uv run --frozen python -W ignore::DeprecationWarning -m unittest discover -s tests -p "test_*.py"
      - name: Run instalar.ps1 from the checkout
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\instalar.ps1
          $app = Join-Path $env:LOCALAPPDATA 'FaturaOCR'
          foreach ($f in 'iniciar.cmd', 'pyproject.toml', 'assets\fatura.ico', '.venv') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "installer did not create $f" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Fatura OCR.lnk'
          if (-not (Test-Path $lnk)) { throw 'desktop shortcut missing' }
          # icone versionado pelo conteudo (o cache de icones do Windows e por caminho)
          $icon = ((New-Object -ComObject WScript.Shell).CreateShortcut($lnk).IconLocation -split ',')[0]
          if ($icon -cnotmatch 'fatura-[0-9a-f]{8}\.ico$' -or -not (Test-Path $icon)) { throw "shortcut icon not versioned: $icon" }
          $mb = (Get-ChildItem $app -Recurse -Force -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ('Installed size: {0:N0} MB' -f $mb)
      - name: Install via "irm | iex" and update in place (downloads main, so not on PRs)
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'FaturaOCR'
          Get-Content -Raw .\instalar.ps1 | iex
          if (-not (Test-Path "$app\iniciar.cmd")) { throw 'irm|iex install did not create iniciar.cmd' }
          # versao instalada (o atalho compara com a ultima publicada); so existe depois da primeira publicacao
          if ((Test-Path "$app\VERSION") -and ((Get-Content -Raw "$app\VERSION").Trim() -cnotmatch '^v\d+\.\d+\.\d+$')) { throw 'bad VERSION' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$app\instalar.ps1"
          foreach ($f in 'iniciar.cmd', 'pyproject.toml', 'assets\fatura.ico', '.venv') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "update in place lost $f" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Fatura OCR.lnk'
          $icon = ((New-Object -ComObject WScript.Shell).CreateShortcut($lnk).IconLocation -split ',')[0]
          if ($icon -cnotmatch 'fatura-[0-9a-f]{8}\.ico$' -or -not (Test-Path $icon)) { throw "update lost versioned icon: $icon" }
      - name: Start with iniciar.ps1 and load the page
        shell: powershell
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'FaturaOCR'
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$app\iniciar.ps1",'--no-browser' -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ -TimeoutSec 5; if ($r.Content -match 'Fatura OCR') { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'the app did not answer on http://127.0.0.1:8765/' }
          Write-Host 'App answered on http://127.0.0.1:8765/'
      - name: Run desinstalar.ps1
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\FaturaOCR\desinstalar.ps1"
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'FaturaOCR')) { throw 'uninstall left the app folder' }

  # Each merge to main whose tests passed becomes a release (v1.0.0, v1.0.1, ...). The installer downloads the
  # latest release and writes its tag to VERSION; the launcher compares it with the latest release and offers
  # to update. Notes = the merged PR's title.
  release:
    name: Publish the next version
    needs: [verify, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # an older run finishing late must not release an outdated commit: only main's current head
          head=$(gh api "repos/$R/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then echo "main moved on ($head); its own run releases it"; exit 0; fi
          last=$(gh api "repos/$R/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$last" ] && [ "$(gh api "repos/$R/commits/$last" --jq .sha)" = "$SHA" ]; then
            echo "already released as $last"; exit 0
          fi
          if [[ "$last" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            next="v1.0.0"
          fi
          title=$(gh api "repos/$R/commits/$SHA/pulls" --jq '.[0].title // empty' 2>/dev/null || true)
          [ -n "$title" ] || title=$(gh api "repos/$R/commits/$SHA" --jq '.commit.message' | head -n 1)
          gh release create "$next" --repo "$R" --target "$SHA" --title "$next" --notes "$title"
          echo "released $next ($SHA): $title"
