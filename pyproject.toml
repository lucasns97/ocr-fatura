[project]
name = "fatura-ocr"
version = "0.1.0"
description = "Converte capturas de tela da fatura do cartão (Inter) em CSV, 100% local."
readme = "README.md"
requires-python = ">=3.10,<3.14"  # o uv usa a versão de .python-version
dependencies = [
    "rapidocr-onnxruntime>=1.2.3,<2",  # OCR; os modelos vêm dentro do pacote (sem download) e ele já traz o OpenCV
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",         # upload de arquivos
]

[project.scripts]
fatura = "fatura_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatura_ocr"]

[dependency-groups]
dev = ["httpx>=0.27", "pillow>=10"]  # testes
